#new version # name: React Component Extraction + UTG External Invocation

name: React Component Extraction + UTG Context Generation

on:
  pull_request:
    paths:
      - "src/**/*.jsx"
      - "src/**/*.tsx"

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  extract-and-run-utg:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # STEP 0 — Checkout React Repository
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # STEP 1 — Setup Node Environment (React Repo)
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install React repo dependencies
        run: npm install --legacy-peer-deps

      # =====================================================
      # STEP 2 — Detect Changed React Component Files
      # =====================================================
      - name: Detect changed JSX / TSX files
        id: changed-files
        run: |
          echo "🔍 Detecting changed React component files..."

          FILES=$(git diff --name-only \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.sha }} | grep -E '\.jsx$|\.tsx$' || true)

          echo "Changed files detected:"
          echo "$FILES"

          FILES_SINGLE_LINE=$(echo "$FILES" | tr '\n' ' ')
          echo "files=$FILES_SINGLE_LINE" >> $GITHUB_OUTPUT

      # =====================================================
      # STEP 3 — Run React Context Extraction Pipeline
      # =====================================================
      - name: Run React context extraction pipeline
        if: steps.changed-files.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          echo "🚀 Running React context extraction..."
          echo "Files under analysis:"
          echo "$CHANGED_FILES"

          mkdir -p context
          node scripts/extractor/index.js

      # =====================================================
      # STEP 4 — Validate Generated Context Files
      # =====================================================
      - name: Validate extraction outputs
        if: steps.changed-files.outputs.files != ''
        run: |
          echo "🔎 Validating generated context files..."

          if [ ! -f "context/react-component-schema.json" ]; then
            echo "❌ react-component-schema.json not found"
            exit 1
          fi

          if [ ! -f "context/utg-prompt.txt" ]; then
            echo "❌ utg-prompt.txt not found"
            exit 1
          fi

          echo "✅ Context files validated successfully"

      # =====================================================
      # STEP 5 — Display UTG Prompt (Debug Visibility)
      # =====================================================
      - name: Display UTG prompt (LLM context)
        if: steps.changed-files.outputs.files != ''
        run: |
          echo "🤖 UTG Prompt Preview"
          echo "-----------------------------------"
          head -n 40 context/utg-prompt.txt
          echo "-----------------------------------"

      # =====================================================
      # STEP 6 — Checkout UTG Repository (FEATURE BRANCH)
      # =====================================================
      - name: Checkout UnitTestGenerationSystem
        uses: actions/checkout@v4
        with:
          repository: prakalps/UnitTestGenerationSystem
          ref: feature/external-prompt-ingestion
          token: ${{ secrets.GH_TOKEN }}
          path: utg

      # =====================================================
      # STEP 7 — Setup Node.js for UTG
      # =====================================================
      - name: Setup Node.js for UTG
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # =====================================================
      # STEP 8 — Install UTG Dependencies
      # =====================================================
      - name: Install UTG dependencies
        working-directory: utg
        run: npm install --legacy-peer-deps

      # =====================================================
      # STEP 9 — Run UTG in EXTERNAL PROMPT MODE (✅ FIXED)
      # =====================================================
      - name: Run UTG with external prompt
        working-directory: utg
        env:
          UTG_MODE: external_prompt
          EXTERNAL_PROMPT_PATH: ../context/utg-prompt.txt
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🚀 Running UTG with external prompt"
          echo "Prompt path: $EXTERNAL_PROMPT_PATH"

          npm run start
