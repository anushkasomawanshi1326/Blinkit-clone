name: Call UTG with External Prompt

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  call-utg:
    name: Invoke Unit Test Generator (External Prompt Mode)
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # STEP 1 — Checkout React Repository
      # ============================================================
      - name: Checkout React repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 2 — Download utg-prompt.txt Artifact
      # Generated by react-component-extraction.yml
      # ============================================================
      - name: Download UTG prompt artifact
        uses: actions/download-artifact@v4
        with:
          name: utg-prompt
          path: utg-context

      # ============================================================
      # STEP 3 — Validate Prompt Existence
      # ============================================================
      - name: Validate external UTG prompt
        run: |
          if [ ! -f utg-context/utg-prompt.txt ]; then
            echo "❌ utg-prompt.txt not found"
            echo "react-component-extraction.yml must run first"
            exit 1
          fi

          echo "✅ utg-prompt.txt detected"
          echo "------ PROMPT PREVIEW ------"
          head -n 30 utg-context/utg-prompt.txt
          echo "----------------------------"

      # ============================================================
      # STEP 4 — Checkout UTG Repository (FEATURE BRANCH)
      # ============================================================
      - name: Checkout UnitTestGenerationSystem
        uses: actions/checkout@v4
        with:
          repository: prakalps/UnitTestGenerationSystem
          ref: feature/external-prompt-ingestion
          token: ${{ secrets.GH_TOKEN }}
          path: utg

      # ============================================================
      # STEP 5 — Setup Node.js for UTG
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # ============================================================
      # STEP 6 — Install UTG Dependencies
      # ============================================================
      - name: Install UTG dependencies
        working-directory: utg
        run: npm install --legacy-peer-deps

      # ============================================================
      # STEP 7 — Run UTG in External Prompt Mode
      # ============================================================
      - name: Run UTG (external prompt ingestion)
        working-directory: utg
        env:
          UTG_MODE: external_prompt
          EXTERNAL_PROMPT_PATH: ../utg-context/utg-prompt.txt
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "🚀 Running UTG with external LLM context"
          echo "Prompt path: $EXTERNAL_PROMPT_PATH"

          node src/index.js
